name: Compilar PhotoCraft Android PT-BR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar ferramentas Android
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Extrair projeto
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "PhotoCraft-Android-PTBR-compilacao-automatica.zip" -Recurse | Select-Object -First 1
          if (-not $zip) { throw "O ZIP do projeto nao foi encontrado no repositorio." }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath "$env:RUNNER_TEMP\photocraft" -Force
          $source = Join-Path "$env:RUNNER_TEMP\photocraft" "photocraft-for-android-main"
          if (-not (Test-Path "$source\packaging\android\build.ps1")) { throw "O projeto Android nao foi encontrado dentro do ZIP." }
          "SOURCE_DIR=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Compilar APK
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_DIR
          .\packaging\android\build.ps1 -Abi arm64-v8a -Jobs 2

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-Android-PTBR
          path: ${{ runner.temp }}/photocraft/photocraft-for-android-main/dist/android/*.apk
          if-no-files-found: error
          retention-days: 14
